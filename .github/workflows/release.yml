# On a tag v*: build borg, borg-mesh and borg-web for Linux x86_64/aarch64 and macOS aarch64, attach
# one tarball per target with its .sha256 to a GitHub release (scripts/install.sh fetches these), then
# publish the crates to crates.io in dependency order.
#
# Needs the repository secret CARGO_REGISTRY_TOKEN (a crates.io token with publish-update scope).
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: true
      matrix:
        include:
          # ubuntu-22.04 rather than -latest: the binaries then need only glibc 2.35.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Every published crate takes version.workspace, but check them all: a crate that pins its own
      # version would otherwise fail only at cargo publish, after the GitHub release exists.
      - name: the tag matches every published crate version
        run: |
          bad=$(cargo metadata --format-version 1 --no-deps | jq -r --arg v "${GITHUB_REF_NAME#v}" \
            '.packages[] | select(.publish != []) | select(.version != $v) | "\(.name) \(.version)"')
          if [ -n "$bad" ]; then
            echo "tag $GITHUB_REF_NAME does not match: $bad" >&2
            exit 1
          fi
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: libc++ headers (macOS)
        if: runner.os == 'macOS'
        run: echo "CXXFLAGS=-isystem $(xcrun --show-sdk-path)/usr/include/c++/v1" >> "$GITHUB_ENV"
      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }} -p borg-ai -p borg-mesh -p borg-web
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          name="borg-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/{borg,borg-mesh,borg-web} "dist/$name/"
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum "$name.tar.gz"; else shasum -a 256 "$name.tar.gz"; fi > "$name.tar.gz.sha256"
          cat "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: borg-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: borg-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true

  # cargo publish --workspace publishes borg-trace, borg-ai, borg-mesh and borg-web in dependency
  # order and skips the publish = false crates (borg-eval, borg-search). crates.io refuses a version
  # it already has, so a re-run after a partial publish excludes the crates the sparse index lists.
  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo publish
        shell: bash
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          names=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.publish != []) | .name')
          exclude=() left=0
          for name in $names; do
            if curl -fsS "https://index.crates.io/${name:0:2}/${name:2:2}/$name" 2>/dev/null \
              | jq -e --arg v "$v" 'select(.vers == $v)' >/dev/null; then
              echo "$name $v is already on crates.io, skipping"
              exclude+=(--exclude "$name")
            else
              left=$((left + 1))
            fi
          done
          if [ "$left" -eq 0 ]; then exit 0; fi
          cargo publish --workspace --locked "${exclude[@]}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
