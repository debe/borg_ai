# On a tag v*, pushed by scripts/release.sh: build borg, borg-mesh and borg-web for Linux x86_64/aarch64
# and macOS aarch64 (Apple silicon only: Intel Macs are deprecated; they build with cargo install
# borg-ai), attach one tarball per target with its .sha256 to the draft release the script created
# (scripts/install.sh fetches these), then publish that release, so releases/latest never lacks its
# tarballs. It publishes nothing to crates.io: the script does that before it tags. Run by hand
# (workflow_dispatch) on a branch it only builds and uploads the tarballs as workflow artifacts; on a tag
# it does what the tag push does (scripts/release.sh runs it so after a tag pushed ahead of the release).
#
# Actions are pinned to commit SHAs, as in ci.yml.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The tag (vX.Y.Z), or the branch name when run by hand.
  TAG: ${{ github.ref_name }}

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: true
      matrix:
        include:
          # ubuntu-22.04 rather than -latest: the binaries then need only glibc 2.35.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: the tag matches every published crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          bad=$(cargo metadata --format-version 1 --no-deps | jq -r --arg v "${TAG#v}" \
            '.packages[] | select(.publish != []) | select(.version != $v) | "\(.name) \(.version)"')
          if [ -n "$bad" ]; then
            echo "tag $TAG does not match: $bad" >&2
            exit 1
          fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: libc++ headers (macOS)
        if: runner.os == 'macOS'
        run: echo "CXXFLAGS=-isystem $(xcrun --show-sdk-path)/usr/include/c++/v1" >> "$GITHUB_ENV"
      # borg-web is built on its own: in one build with borg-ai, feature unification would compile
      # borg-ai's default vectors stack into it, which it leaves out (default-features = false).
      - name: build
        run: |
          set -eu
          cargo build --release --locked --target ${{ matrix.target }} -p borg-ai -p borg-mesh
          cargo build --release --locked --target ${{ matrix.target }} -p borg-web
      - name: the binaries run
        run: |
          set -eu
          b=target/${{ matrix.target }}/release
          $b/borg help >/dev/null
          $b/borg-mesh help >/dev/null 2>&1 || $b/borg-mesh --help >/dev/null
          $b/borg-web --help >/dev/null
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          name="borg-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/{borg,borg-mesh,borg-web} "dist/$name/"
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum "$name.tar.gz"; else shasum -a 256 "$name.tar.gz"; fi > "$name.tar.gz.sha256"
          cat "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: borg-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  attach:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: borg-*
          path: dist
          merge-multiple: true
      - name: attach the tarballs and publish the release
        run: |
          set -eu
          # A tag pushed ahead of scripts/release.sh has no draft yet; the script re-runs this then.
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "no release for $TAG yet: scripts/release.sh creates it and re-runs this workflow"
            exit 0
          fi
          gh release upload "$TAG" dist/*.tar.gz dist/*.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
