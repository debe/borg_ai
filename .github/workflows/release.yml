# On a tag v*: build borg, borg-mesh and borg-web for Linux x86_64/aarch64 and macOS aarch64 (Apple
# silicon only: Intel Macs are deprecated; they build with cargo install borg-ai), attach
# one tarball per target with its .sha256 to a GitHub release (scripts/install.sh fetches these), then
# publish the crates to crates.io in dependency order. The GitHub release waits for a
# `cargo publish --dry-run`, so a crate that would not publish stops the tag before anything is released. Run by hand (workflow_dispatch) it only builds
# and uploads the tarballs as workflow artifacts: no release, no publish.
#
# Needs the repository secret CARGO_REGISTRY_TOKEN (a crates.io token with publish-update scope).
# Actions are pinned to commit SHAs, as in ci.yml.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: true
      matrix:
        include:
          # ubuntu-22.04 rather than -latest: the binaries then need only glibc 2.35.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # Every published crate takes version.workspace, but check them all: a crate that pins its own
      # version would otherwise fail only at cargo publish, after the GitHub release exists.
      - name: the tag matches every published crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          bad=$(cargo metadata --format-version 1 --no-deps | jq -r --arg v "${GITHUB_REF_NAME#v}" \
            '.packages[] | select(.publish != []) | select(.version != $v) | "\(.name) \(.version)"')
          if [ -n "$bad" ]; then
            echo "tag $GITHUB_REF_NAME does not match: $bad" >&2
            exit 1
          fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: libc++ headers (macOS)
        if: runner.os == 'macOS'
        run: echo "CXXFLAGS=-isystem $(xcrun --show-sdk-path)/usr/include/c++/v1" >> "$GITHUB_ENV"
      # borg-web is built on its own: in one build with borg-ai, feature unification would compile
      # borg-ai's default vectors stack into it, which it leaves out (default-features = false).
      - name: build
        run: |
          set -eu
          cargo build --release --locked --target ${{ matrix.target }} -p borg-ai -p borg-mesh
          cargo build --release --locked --target ${{ matrix.target }} -p borg-web
      - name: the binaries run
        run: |
          set -eu
          b=target/${{ matrix.target }}/release
          $b/borg help >/dev/null
          $b/borg-mesh help >/dev/null 2>&1 || $b/borg-mesh --help >/dev/null
          $b/borg-web --help >/dev/null
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          name="borg-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/{borg,borg-mesh,borg-web} "dist/$name/"
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum "$name.tar.gz"; else shasum -a 256 "$name.tar.gz"; fi > "$name.tar.gz.sha256"
          cat "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: borg-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  # Every crate packages and builds as crates.io would see it (workspace members from a local overlay),
  # before the GitHub release exists: a publish failure then leaves no half-done release behind.
  publish-dry-run:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo publish --dry-run --workspace --locked

  release:
    needs: [build, publish-dry-run]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: borg-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true

  # cargo publish --workspace publishes borg-trace, borg-ai, borg-mesh and borg-web in dependency
  # order and skips the publish = false crates (borg-eval, borg-search). crates.io refuses a version
  # it already has, so a re-run after a partial publish excludes the crates the sparse index lists.
  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo publish
        shell: bash
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          names=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.publish != []) | .name')
          exclude=() left=0
          for name in $names; do
            if curl -fsS "https://index.crates.io/${name:0:2}/${name:2:2}/$name" 2>/dev/null \
              | jq -e --arg v "$v" 'select(.vers == $v)' >/dev/null; then
              echo "$name $v is already on crates.io, skipping"
              exclude+=(--exclude "$name")
            else
              left=$((left + 1))
            fi
          done
          if [ "$left" -eq 0 ]; then exit 0; fi
          cargo publish --workspace --locked "${exclude[@]}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
