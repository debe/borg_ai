# scripts/check.sh on Linux and macOS for every push to main (no PR runs: work lands on main).
# Actions are pinned to commit SHAs (the comment names the release); bump them with
# `gh api repos/<owner>/<action>/commits/<tag> --jq .sha`.
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # A CI hang guard (a test or a build that never returns), not a target: about twice the longest
    # observed run. The longest of 56 runs each (Oct 2026) took 14 min on Linux and 30 min on macOS
    # (a cold cache); typical runs take 7 and 10 min.
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 60 || 30 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The adapter tests and the conformance suite run TypeScript with `node --test` (Node 23.6+).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # esaxx-rs (tokenizers) builds C++ against libc++; point it at the SDK's headers.
      - name: libc++ headers (macOS)
        if: runner.os == 'macOS'
        run: echo "CXXFLAGS=-isystem $(xcrun --show-sdk-path)/usr/include/c++/v1" >> "$GITHUB_ENV"
      # Some tests commit in scratch repos; a runner has no git identity of its own.
      - name: git identity
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
      - run: scripts/check.sh
