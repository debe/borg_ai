[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.7.11"
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/debe/borg_ai"
homepage = "https://github.com/debe/borg_ai"
keywords = ["ai", "agents", "claude-code", "memory"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.91"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
regex = "1"

# Every `unsafe` block names the invariant it relies on (`// SAFETY:`), and every `unsafe fn` its contract.
[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
missing_safety_doc = "warn"

# Tests run the numeric selection code (posterior draws) many thousand times: unoptimised it took CI
# 4+ minutes per suite run. `cargo build` (dev) is unchanged; only `cargo test` builds at opt-level 1.
[profile.test]
opt-level = 1
