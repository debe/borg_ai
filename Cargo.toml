[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/debe/borg_ai"
homepage = "https://github.com/debe/borg_ai"
keywords = ["ai", "agents", "claude-code", "memory"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.91"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
regex = "1"
