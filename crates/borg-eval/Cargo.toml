[package]
name = "borg-eval"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "Run drone arms on eval workloads and measure cost per solved task"
publish = false

[dependencies]
borg-trace = { path = "../borg-trace", version = "0.2.0" }
borg = { package = "borg-ai", path = "../borg", version = "0.2.0" }
# arm E: two stores synced by the mesh's own protocol over loopback (hive/arm_e.rs)
borg-mesh = { path = "../borg-mesh", version = "0.2.0" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
blake3 = "1.8"
# sandbox-exec: the sandbox dies with its caller (PR_SET_PDEATHSIG)
libc = "0.2"
