<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Borg Collective</title>

<script type="module">
import init, * as bindings from '/borg-web-ui.js';
const wasm = await init({ module_or_path: '/borg-web-ui_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
<style>
:root {
  --paper: #f1f2f4; --panel: #ffffff; --panel-2: #f7f8fa; --ink: #12161c; --muted: #5a6371; --rule: #d5d9e0;
  --accent: #1f49c7; --accent-soft: #e2e8fa; --heat: #b8471f; --heat-soft: #f6e4dc; --good: #1f7a4d; --good-soft: #def0e6;
  --c-accent: #1f49c7; --c-good: #1f8a55; --c-heat: #c4501f; --c-violet: #6b45c9; --c-amber: #b7791f;
  --c-teal: #0f8a8a; --c-sky: #3b82c4; --c-pink: #c23f7a; --c-slate: #8a94a6; --c-muted: #5a6371;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --shadow: 0 1px 2px rgba(18, 22, 28, .05), 0 4px 16px rgba(18, 22, 28, .04);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d1015; --panel: #141922; --panel-2: #1a2030; --ink: #e3e7ee; --muted: #8d97a7; --rule: #272f3b;
    --accent: #8aa6ff; --accent-soft: #18213a; --heat: #f08a5d; --heat-soft: #2c1a12; --good: #5fc994; --good-soft: #12271c;
    --c-accent: #7f9cff; --c-good: #4fc48a; --c-heat: #f08a5d; --c-violet: #a98cf5; --c-amber: #e0a94a;
    --c-teal: #3cc6c6; --c-sky: #6cb2f0; --c-pink: #ee79ad; --c-slate: #6f7a8c; --c-muted: #8d97a7;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--sans); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
a { color: var(--accent); text-decoration: none; }
main { max-width: 1180px; margin: 0 auto; padding: 18px 16px 72px; display: grid; gap: 20px; }
h2 { margin: 0 0 12px; font-size: 1.02rem; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
h2 small { font-weight: 400; font-size: .8rem; color: var(--muted); }
.mono { font-family: var(--mono); font-size: .82em; }
.empty { color: var(--muted); font-size: .9rem; margin: 6px 0; }

/* header and tabs */
header.top { max-width: 1180px; margin: 0 auto; padding: 16px 16px 10px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand h1 { margin: 0; font-size: 1.3rem; letter-spacing: -.01em; }
.logo { width: 28px; height: 28px; }
.logo-cube { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.4; stroke-linejoin: round; }
.logo-edge { fill: none; stroke: var(--accent); stroke-width: 1.1; opacity: .6; }
.logo-core { fill: var(--accent); }
.grow { flex: 1; }
select, input.search { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 10px; max-width: 100%; }
input.search { width: min(420px, 100%); }
.drones-now { font: 500 .75rem var(--mono); color: var(--muted); }
.live { font: 500 .72rem var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--c-slate); display: inline-block; }
.live.on i { background: var(--c-good); box-shadow: 0 0 0 0 var(--c-good); animation: pulse 2.4s ease-out infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c-good) 60%, transparent); } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
/* borg itself: a newer release, a member on another protocol (banner.rs) */
.update-banner { max-width: 1180px; margin: 0 auto 10px; padding: 0 16px; font-size: .88rem; }
.update-banner > * { margin: 0; padding: 10px 14px; background: var(--heat-soft); border: 1px solid color-mix(in srgb, var(--heat) 40%, transparent); border-radius: 8px; }
.update-banner > * + * { margin-top: 6px; }
.update-banner ul { list-style: none; display: grid; gap: 4px; }
.update-banner code { font: 600 .82rem var(--mono); }
nav.tabs { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--rule); display: flex; gap: 2px; overflow-x: auto; padding: 0 max(16px, calc((100% - 1180px) / 2 + 16px)); scrollbar-width: none; }
nav.tabs a { color: var(--muted); padding: 10px 12px; font-weight: 500; font-size: .92rem; white-space: nowrap; border-bottom: 2px solid transparent; }
nav.tabs a:hover { color: var(--ink); }
nav.tabs a.on { color: var(--ink); border-bottom-color: var(--accent); }

/* panels and layout */
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.stack { display: grid; gap: 20px; min-width: 0; }
@media (max-width: 820px) { .two { grid-template-columns: 1fr; } }

/* tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.tile { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px 10px; display: grid; gap: 2px; box-shadow: var(--shadow); min-width: 0; }
.tile-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.tile .l { font: 500 .68rem var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.tile .v { font: 700 1.7rem/1.15 var(--sans); font-variant-numeric: tabular-nums; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .s { font-size: .78rem; color: var(--muted); }
.tile .s.warn { color: var(--c-heat); }
.delta { font: 600 .7rem var(--mono); padding: 1px 6px; border-radius: 10px; background: var(--panel-2); color: var(--muted); }
.delta.good { color: var(--good); background: var(--good-soft); }
.delta.bad { color: var(--heat); background: var(--heat-soft); }
.tile-spark { height: 30px; margin-top: 4px; }
.spark { width: 100%; height: 30px; display: block; }
.spark-line { fill: none; stroke-width: 1.6; vector-effect: non-scaling-stroke; }

/* stacked chart */
.chart { position: relative; }
.chart-bar { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 6px; }
.legend-item { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; padding: 3px 8px; border-radius: 12px; border: 1px solid var(--rule); background: var(--panel); transition: opacity .15s; }
.legend-item i, .tip-row i, .dl-row i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; flex: none; }
.legend-item.off { opacity: .38; text-decoration: line-through; }
.seg { display: inline-flex; align-items: center; gap: 2px; background: var(--panel-2); border: 1px solid var(--rule); border-radius: 8px; padding: 2px; }
.seg button { font: 500 .74rem var(--mono); padding: 3px 9px; border-radius: 6px; color: var(--muted); }
.seg button.on { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
.seg-l { font: .72rem var(--mono); color: var(--muted); padding: 0 6px; }
.chart-plot { position: relative; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
svg .grid { stroke: var(--rule); stroke-width: 1; }
svg .axis { font: 11px var(--mono); fill: var(--muted); }
svg .axis.strong { fill: var(--ink); font-weight: 600; }
svg .cumline { fill: none; stroke: var(--ink); stroke-width: 2; stroke-dasharray: 5 4; opacity: .7; }
svg .hit { fill: transparent; }
svg .focus { fill: var(--accent-soft); opacity: .8; }
.tip { position: absolute; top: -4px; pointer-events: none; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.14); padding: 8px 10px; font-size: .78rem; min-width: 170px; z-index: 3; }
.tip-head { display: flex; justify-content: space-between; gap: 12px; font-weight: 600; margin-bottom: 4px; }
.tip-row { display: grid; grid-template-columns: 9px 1fr auto; align-items: center; gap: 6px; }
.tip-row b { font-family: var(--mono); font-weight: 500; }
.empty.overlay { position: absolute; inset: 40% 0 auto; text-align: center; }

/* funnel */
.funnel-step { display: grid; gap: 3px; margin-bottom: 12px; }
.funnel-label { font-size: .9rem; }
.funnel-label b { font-variant-numeric: tabular-nums; font-size: 1.05rem; }
.funnel-track { height: 14px; background: var(--panel-2); border-radius: 7px; overflow: hidden; }
.funnel-fill { height: 100%; border-radius: 7px; transition: width .4s ease; }
.funnel-note { font: .74rem var(--mono); color: var(--muted); }

/* donut */
.donut { display: grid; grid-template-columns: minmax(140px, 200px) 1fr; gap: 16px; align-items: center; }
@media (max-width: 520px) { .donut { grid-template-columns: 1fr; } .donut-fig { max-width: 200px; margin: 0 auto; } }
.donut svg { width: 100%; height: auto; }
.donut-seg { fill: none; stroke-width: 14; transition: opacity .15s; cursor: default; }
.donut-seg.dim { opacity: .3; }
.donut-empty { fill: none; stroke: var(--rule); stroke-width: 14; }
.donut-v { font: 700 15px var(--sans); fill: var(--ink); }
.donut-fig { margin: 0; text-align: center; }
.donut-c { font: .75rem var(--mono); color: var(--muted); margin-top: 6px; overflow-wrap: anywhere; }
.dl-row { display: grid; grid-template-columns: 9px 1fr auto 44px; gap: 8px; align-items: center; font-size: .86rem; padding: 4px 6px; border-radius: 6px; }
.dl-row.hl { background: var(--panel-2); }
.dl-row b { font-family: var(--mono); font-weight: 500; }
.dl-row em { font: .75rem var(--mono); color: var(--muted); font-style: normal; text-align: right; }

/* horizontal bars and ranks */
.hbar { display: grid; grid-template-columns: minmax(80px, 38%) 1fr minmax(64px, max-content); gap: 8px; align-items: center; font-size: .84rem; padding: 3px 0; }
.hbar.pick { cursor: pointer; } .hbar.pick:hover .hbar-l { color: var(--accent); }
.hbar-l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar-t { height: 10px; background: var(--panel-2); border-radius: 5px; overflow: hidden; }
.hbar-f { display: block; height: 100%; border-radius: 5px; }
.hbar-v { font: .78rem var(--mono); text-align: right; white-space: nowrap; }
.hbar.wrap { grid-template-columns: minmax(140px, 50%) 1fr minmax(64px, max-content); }
.hbar.wrap .hbar-l { white-space: normal; line-height: 1.25; }
.hbar.few .hbar-l, .few { color: var(--muted); font-style: italic; }

/* hover help, section heads, 100% bars, lesson table (Conscience) */
.help { display: inline-block; margin-left: 6px; font: 400 .72rem var(--sans); color: var(--muted); cursor: help; vertical-align: super; text-transform: none; letter-spacing: 0; }
.help:hover, .help:focus { color: var(--accent); outline: none; }
.tile[title] { cursor: help; }
.section-head { margin: 28px 0 0; display: grid; gap: 4px; }
.section-head h1 { font: 600 1.15rem var(--sans); margin: 0; }
.verdict { font-size: .92rem; margin: 0; }
.verdict b { font-variant-numeric: tabular-nums; }
.verdict .warn { color: var(--c-heat); } .verdict .ok { color: var(--c-good); }
.how { font-size: .8rem; color: var(--muted); margin: 8px 0 0; max-width: 90ch; }
.how b { color: var(--ink); font-variant-numeric: tabular-nums; }
.panel h3 { font-size: .92rem; margin: 18px 0 8px; }
.stackbar-wrap { display: grid; gap: 8px; }
.stackbar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--panel-2); }
.stackbar > span { height: 100%; }
.stackbar.compact { height: 8px; min-width: 80px; border-radius: 4px; }
.stackbar-legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.ltable { width: 100%; border-collapse: collapse; font-size: .84rem; }
.ltable th { font: 500 .68rem var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); text-align: right; padding: 4px 6px; cursor: help; }
.ltable th:first-child, .ltable td:first-child { text-align: left; }
.ltable td { padding: 5px 6px; border-top: 1px solid var(--rule); text-align: right; font-variant-numeric: tabular-nums; }
.ltable td.outcome { width: 120px; }
.ltable tr.pick { cursor: pointer; } .ltable tr.pick:hover td:first-child { color: var(--accent); }
.sorts { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.sorts button { font-size: .78rem; padding: 2px 8px; border: 1px solid var(--rule); border-radius: 12px; background: none; color: var(--muted); cursor: pointer; }
.sorts button.on { color: var(--accent); border-color: var(--accent); }
.group.diag > summary { font-weight: 600; }
.group.diag > .stack { padding: 0 16px 16px; }
.rank { display: grid; grid-template-columns: 1fr 90px 80px; gap: 10px; align-items: center; width: 100%; padding: 7px 4px; border-bottom: 1px solid var(--rule); font-size: .86rem; }
.rank:hover .rank-q { color: var(--accent); }
.rank-bar { height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
.rank-bar span { display: block; height: 100%; border-radius: 4px; }
.rank-v { font: .76rem var(--mono); text-align: right; color: var(--muted); }
@media (max-width: 520px) { .rank { grid-template-columns: 1fr 70px; } .rank-bar { display: none; } }

/* feed */
.feed { display: grid; gap: 2px; max-height: 640px; overflow-y: auto; }
.feed.compact { max-height: 430px; }
.feed-row { display: grid; grid-template-columns: 26px 1fr; gap: 10px; padding: 8px 6px; border-radius: 8px; }
.feed-row.new { animation: glow 2.6s ease-out; }
@keyframes glow { 0% { background: var(--accent-soft); } 100% { background: transparent; } }
.glyph { width: 24px; height: 24px; border-radius: 50%; color: #fff; display: grid; place-items: center; font-size: .78rem; font-weight: 700; }
.feed-body { min-width: 0; display: grid; gap: 2px; }
.feed-head { font-size: .88rem; font-weight: 550; }
.feed-detail { font-size: .82rem; color: var(--muted); overflow-wrap: anywhere; }
.feed-lesson { font-size: .82rem; color: var(--accent); }
.feed-lesson:hover { text-decoration: underline; }
.feed-meta { font: .72rem var(--mono); color: var(--muted); }
.more { display: inline-block; margin-top: 8px; font-size: .85rem; }

/* facts */
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.fact { display: grid; gap: 4px; align-content: start; background: var(--panel); border: 1px solid var(--rule); border-left: 4px solid var(--c-accent); border-radius: 10px; padding: 14px; box-shadow: var(--shadow); cursor: default; }
.fact.pick { cursor: pointer; } .fact.pick:hover { border-color: var(--accent); }
.fact.g { border-left-color: var(--c-good); } .fact.h { border-left-color: var(--c-heat); } .fact.m { border-left-color: var(--c-slate); } .fact.v { border-left-color: var(--c-violet); }
.fact-big { font: 700 1.35rem/1.2 var(--sans); overflow-wrap: anywhere; }
.fact-text { font-size: .86rem; color: var(--muted); }

/* knowledge */
.kn-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.kn-bar h2 { margin: 0; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: .9rem; color: var(--muted); }
.crumbs button { color: var(--accent); padding: 2px 4px; border-radius: 4px; }
.crumbs button.on { color: var(--ink); font-weight: 600; }
.treemap { width: 100%; height: auto; display: block; }
.tm-cell { cursor: pointer; }
.tm-cell rect { stroke: var(--panel); stroke-width: 1; transition: fill-opacity .2s; }
.tm-cell:hover rect { fill-opacity: 1 !important; }
.tm-text { fill: var(--ink); pointer-events: none; }
.tm-text.light { fill: #fff; }
.tm-label { font: 600 14px var(--sans); }
.tm-sub { font: 11px var(--mono); opacity: .85; }
.tm-sys { font: 700 12.5px var(--sans); fill: var(--ink); pointer-events: none; }
.tm-system { cursor: zoom-in; }
.tm-frame { fill: var(--panel-2); stroke-width: 1.5; }
.sys-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.sys-chip { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; padding: 3px 10px; border: 1px solid var(--rule); border-radius: 14px; background: var(--panel); }
.sys-chip:hover { border-color: var(--accent); }
.sys-chip i { width: 9px; height: 9px; border-radius: 2px; }
.sys-chip b { font: 600 .72rem var(--mono); color: var(--muted); }
.hint { font-size: .8rem; color: var(--muted); margin: 8px 0 0; }
.kn-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
@media (max-width: 900px) { .kn-grid { grid-template-columns: 1fr; } }
.kn-list { display: grid; gap: 12px; min-width: 0; }
.kn-side { display: grid; gap: 20px; min-width: 0; }
.group { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow); }
.group > summary { list-style: none; cursor: pointer; padding: 12px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.group > summary::-webkit-details-marker { display: none; }
.group > summary::before { content: "▸"; color: var(--muted); transition: transform .15s; }
.group[open] > summary::before { transform: rotate(90deg); }
.group-name { font-weight: 650; }
.group-count { font: 600 .72rem var(--mono); background: var(--accent-soft); color: var(--accent); padding: 1px 8px; border-radius: 10px; }
.group-meta { font: .74rem var(--mono); color: var(--muted); margin-left: auto; }
.cards { display: grid; gap: 8px; padding: 0 12px 12px; }
.panel .group { box-shadow: none; margin-top: 12px; }
.more-cards > summary { cursor: pointer; color: var(--accent); font-size: .86rem; padding: 6px 2px; list-style: none; }
.more-cards > summary::-webkit-details-marker { display: none; }
.more-cards[open] > summary { display: none; }
.cards.inner { padding: 0; }
.lesson { display: grid; gap: 5px; width: 100%; background: var(--panel-2); border: 1px solid transparent; border-radius: 8px; padding: 10px 12px; }
.lesson:hover { border-color: var(--accent); }
.lesson.dormant { opacity: .55; }
.lesson .q { font-weight: 600; font-size: .92rem; }
.lesson .c { color: var(--muted); font-size: .84rem; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font: .72rem var(--mono); color: var(--muted); }
.stat { margin-left: 2px; }
.chip { border: 1px solid currentColor; border-radius: 3px; padding: 0 6px; font: .68rem var(--mono); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.chip.a { color: var(--accent); } .chip.g { color: var(--good); } .chip.v { color: var(--c-violet); } .chip.h { color: var(--heat); } .chip.k { color: var(--c-sky); }
.lesson.absorbed { border-left: 3px solid var(--c-sky); }
.held { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font: .72rem var(--mono); color: var(--muted); }
.held-note { color: var(--ink); overflow-wrap: anywhere; }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(10, 14, 20, .38); z-index: 20; animation: fade .15s; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100vw); background: var(--panel); z-index: 21; overflow-y: auto; padding: 18px 20px 40px; box-shadow: -12px 0 40px rgba(0,0,0,.18); animation: slide .2s ease-out; display: grid; gap: 14px; align-content: start; }
@keyframes slide { from { transform: translateX(40px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
.drawer-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.x { font-size: 1.6rem; line-height: 1; color: var(--muted); padding: 0 4px; }
.drawer-q { margin: 0; font-size: 1.15rem; line-height: 1.35; }
.drawer-sec .k { font: 500 .68rem var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 6px; }
.drawer-sec ul { margin: 0; padding-left: 18px; font-size: .9rem; display: grid; gap: 3px; }
.conseq { margin: 0; padding: 10px 12px; background: var(--heat-soft); border-radius: 8px; font-size: .9rem; }
.meter { height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; margin-bottom: 6px; }
.meter span { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.facts-dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; font-size: .86rem; }
.facts-dl dt { color: var(--muted); }
.facts-dl dd { margin: 0; overflow-wrap: anywhere; }

/* steering, queen, drones */
.explain p { margin: 0 0 10px; color: var(--muted); max-width: 70ch; }
.explain pre { margin: 0; background: var(--panel-2); border-radius: 8px; padding: 12px; font: .8rem/1.6 var(--mono); overflow-x: auto; }
.reject { padding: 8px 0; border-bottom: 1px solid var(--rule); display: grid; gap: 3px; }
.reject-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.reject-why { font-size: .9rem; font-weight: 550; overflow-wrap: anywhere; }
.reject-in { font: .76rem var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.queen-list { display: grid; gap: 10px; }
.queen-card { display: grid; gap: 8px; padding: 12px; border-radius: 8px; background: var(--panel-2); margin-bottom: 10px; border-left: 3px solid var(--c-violet); }
.queen-card.answered { border-left-color: var(--c-good); }
.queen-card.dismissed { border-left-color: var(--c-slate); opacity: .75; }
.queen-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.queen-q { font-weight: 600; font-size: .92rem; }
.options { display: flex; flex-wrap: wrap; gap: 6px; }
.opt { font-size: .8rem; padding: 3px 9px; border-radius: 12px; border: 1px solid var(--rule); background: var(--panel); }
.opt.default { border-color: var(--c-violet); }
.opt.chosen { border-color: var(--c-good); background: var(--good-soft); font-weight: 600; }
.answer { font-size: .88rem; }
.badge { font: 600 .66rem var(--mono); text-transform: uppercase; letter-spacing: .06em; padding: 2px 7px; border-radius: 10px; background: var(--panel); border: 1px solid var(--rule); color: var(--muted); }
.badge.open, .badge.waiting { color: var(--c-violet); border-color: var(--c-violet); }
.badge.answered, .badge.working { color: var(--c-good); border-color: var(--c-good); }
.badge.idle { color: var(--c-amber); border-color: var(--c-amber); }
.badge.paused { color: var(--c-pink); border-color: var(--c-pink); }
.badge.remote { color: var(--c-sky); border-color: var(--c-sky); }
.toggle { font-size: .85rem; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
.drones { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.drone { display: grid; grid-template-columns: minmax(0, 1fr); min-width: 0; gap: 6px; align-content: start; padding: 12px; border-radius: 10px; background: var(--panel-2); border-top: 3px solid var(--c-slate); }
.drone.working { border-top-color: var(--c-good); } .drone.waiting { border-top-color: var(--c-violet); } .drone.idle { border-top-color: var(--c-amber); } .drone.ended { opacity: .6; }
.drone-head { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.drone-name { font-weight: 650; margin-right: auto; }
.drone-who { font-size: .82rem; color: var(--muted); }
.drone-doing { font-size: .86rem; }
.drone-files { display: flex; flex-wrap: wrap; gap: 6px; color: var(--muted); }
.drone-files .mono { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drone-doing, .drone-who { overflow-wrap: anywhere; }
/* messages chat */
.chat-filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.chat-filters input.search { width: min(280px, 100%); }
.chat { display: grid; grid-template-columns: 320px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); height: min(74vh, 780px); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
.chat-list { overflow-y: auto; min-height: 0; border-right: 1px solid var(--rule); background: var(--panel-2); }
.conv { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; width: 100%; padding: 10px 12px; border-bottom: 1px solid var(--rule); }
.conv:hover { background: var(--panel); }
.conv.on { background: var(--panel); box-shadow: inset 3px 0 0 var(--accent); }
.conv-title { font-weight: 600; font-size: .88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conv-sub { font: .7rem var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conv-last { font-size: .8rem; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.conv-side { display: grid; justify-items: end; align-content: start; gap: 4px; font: .7rem var(--mono); color: var(--muted); }
.count { font: 600 .68rem var(--mono); background: var(--accent-soft); color: var(--accent); padding: 0 7px; border-radius: 10px; }
.unread { font: 700 .68rem var(--mono); background: var(--c-violet); color: #fff; padding: 0 7px; border-radius: 10px; }
.avatars { display: flex; }
.avatars .avatar + .avatar { margin-left: -8px; box-shadow: 0 0 0 2px var(--panel-2); }
.avatar { width: 30px; height: 30px; border-radius: 50%; color: #fff; display: grid; place-items: center; font: 700 .7rem var(--sans); flex: none; }
.avatar-gap { width: 30px; }
.chat-thread { display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; min-height: 0; }
.thread-head { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--rule); }
.who { display: flex; gap: 8px; align-items: center; }
.thread-body { overflow-y: auto; padding: 12px 16px; display: grid; gap: 2px; align-content: start; }
.day-sep { text-align: center; margin: 12px 0 6px; font: .7rem var(--mono); color: var(--muted); }
.day-sep span { background: var(--panel-2); padding: 2px 10px; border-radius: 10px; }
.msg { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 8px; max-width: 78%; justify-self: start; }
.msg.mine { justify-self: end; grid-template-columns: minmax(0, 1fr) 30px; }
.msg.mine .avatar, .msg.mine .avatar-gap { order: 2; }
.msg.start { margin-top: 10px; }
.bubble { background: var(--panel-2); border: 1px solid var(--rule); border-radius: 12px 12px 12px 4px; padding: 8px 12px; display: grid; gap: 4px; }
.msg.mine .bubble { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 25%, transparent); border-radius: 12px 12px 4px 12px; }
.bubble.ask { border-left: 3px solid var(--c-violet); }
.bubble-who { font-size: .78rem; font-weight: 600; }
.bubble-text { font-size: .88rem; white-space: pre-wrap; overflow-wrap: anywhere; }
.bubble-meta { display: flex; gap: 8px; align-items: center; font: .68rem var(--mono); color: var(--muted); }
.quote { font-size: .78rem; color: var(--muted); border-left: 3px solid var(--rule); padding: 2px 8px; background: var(--panel); border-radius: 4px; text-align: left; }
.quote:hover { color: var(--ink); }
.copy { margin-left: auto; color: var(--accent); }
.msg.hl .bubble { animation: glow 2s ease-out; }
.group.refused { box-shadow: none; }
@media (max-width: 820px) {
  .chat { grid-template-columns: 1fr; grid-template-rows: auto; height: auto; }
  .chat-list { max-height: 260px; border-right: 0; border-bottom: 1px solid var(--rule); }
  .thread-body { max-height: 70vh; }
}
/* the Cube (views/cube.rs): a dark viewscreen in either theme, the canvas under the text around it.
   The text is one grid over the canvas: counters on top, the ticker (left), toasts and the selection
   (right) in the middle, the legend chips and the timeline at the bottom, so none covers another. */
.cube { --borg: #39ff88; --borg-dim: rgba(57, 255, 136, .55); --borg-faint: rgba(57, 255, 136, .08); --scr: #020806;
  --tell: #39ff88; --ask: #ffb547; --seen: #4fd8ff; --lesson: #f2fff7; --sync: #7ea8ff; --handoff: #c79bff; --veto: #ff4d5e; --resume: #d9ffe9;
  --glass: rgba(2, 12, 8, .62); --edge: rgba(57, 255, 136, .24);
  position: relative; height: clamp(480px, 74vh, 880px); border-radius: 12px; overflow: hidden; isolation: isolate;
  border: 1px solid rgba(57, 255, 136, .28); color: #c8ffdf; font-family: var(--mono);
  background: radial-gradient(ellipse at 50% 46%, #0b2a1b 0%, #04120b 38%, var(--scr) 75%);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, .4), 0 12px 40px rgba(0, 0, 0, .35), inset 0 0 120px rgba(0, 0, 0, .85); }
.cube::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background-image: linear-gradient(var(--borg-faint) 1px, transparent 1px), linear-gradient(90deg, var(--borg-faint) 1px, transparent 1px);
  background-size: 44px 44px; background-position: center; mask-image: radial-gradient(ellipse at center, #000 30%, transparent 78%); }
.cube::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 2;
  background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .22) 0 1px, transparent 1px 3px); mix-blend-mode: multiply; }
.cube button { color: inherit; }
.cube-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; outline: none; }
.cube-canvas:active { cursor: grabbing; }
.cube-canvas:focus-visible { box-shadow: inset 0 0 0 2px var(--borg-dim); }
.cube-ui { position: absolute; inset: 0; z-index: 3; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px;
  padding: 14px 16px 10px; pointer-events: none; }
.cube-ui button, .cube-ui a, .tl-strip, .cube-stat, .cube-panel { pointer-events: auto; }
.cube-ui :focus-visible { outline: 1px solid var(--borg); outline-offset: 2px; }
.cube-vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
/* counters: the number counts up to a new value (a registered integer that transitions) */
@property --n { syntax: "<integer>"; inherits: false; initial-value: 0; }
.cube-hud { display: grid; gap: 8px; min-width: 0; }
.cube-title { font-size: .72rem; letter-spacing: .32em; color: var(--borg); text-shadow: 0 0 8px rgba(57, 255, 136, .6); overflow-wrap: anywhere; }
.cube-stats { display: flex; flex-wrap: wrap; gap: 6px; }
.cube-stat { min-width: 84px; padding: 5px 9px; border: 1px solid var(--edge); border-radius: 6px; background: var(--glass);
  backdrop-filter: blur(3px); display: grid; line-height: 1.15; cursor: help; }
.cube-stat b { font-size: 1.2rem; color: #eafff2; font-weight: 600; text-shadow: 0 0 10px rgba(57, 255, 136, .45); font-variant-numeric: tabular-nums;
  counter-reset: n var(--n); transition: --n .6s ease-out; }
.cube-stat b::after { content: counter(n); }
.cube-stat span { font-size: .6rem; letter-spacing: .08em; text-transform: uppercase; color: var(--borg-dim); }
.cube-meter { display: block; height: 3px; margin-top: 4px; border-radius: 2px; background: rgba(57, 255, 136, .14); overflow: hidden; }
.cube-meter i { display: block; height: 100%; background: var(--borg); box-shadow: 0 0 6px var(--borg); transition: width .6s ease-out; }
/* the middle: ticker bottom left, toasts top right, the selection bottom right */
.cube-mid { position: relative; min-height: 0; }
.cube-ticker { position: absolute; left: 0; bottom: 0; width: clamp(220px, 30%, 360px); max-height: 100%; overflow: hidden; margin: 0; padding: 0;
  list-style: none; display: flex; flex-direction: column-reverse; gap: 3px; mask-image: linear-gradient(to top, #000 60%, transparent); }
.tk { flex: none; font-size: .7rem; line-height: 1.35; color: #b9f5d2; animation: tk-in .5s ease-out; }
.tk, .tk button { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.tk button { text-align: left; cursor: pointer; font: inherit; }
.tk button:hover { color: #f2fff7; text-shadow: 0 0 8px rgba(242, 255, 247, .5); }
.tk:nth-child(n+4) { opacity: .6; }
.tk-kind { display: inline-block; min-width: 52px; margin-right: 7px; padding: 0 5px; border-radius: 3px; font-size: .58rem; text-transform: uppercase;
  letter-spacing: .08em; text-align: center; color: #021006; background: var(--tell); }
.tk-ask .tk-kind { background: var(--ask); } .tk-seen .tk-kind { background: var(--seen); } .tk-veto .tk-kind { background: var(--veto); }
.tk-resume .tk-kind { background: var(--resume); } .tk-sync .tk-kind { background: var(--sync); } .tk-handoff .tk-kind { background: var(--handoff); }
.tk-lesson .tk-kind { background: var(--lesson); box-shadow: 0 0 8px rgba(242, 255, 247, .55); }
.tk-lesson { color: #eafff2; }
.tk-ago { margin-left: 7px; color: rgba(185, 245, 210, .62); }
@keyframes tk-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.cube-toasts { position: absolute; z-index: 2; top: 0; right: 0; width: min(320px, 100%); display: grid; gap: 6px; justify-items: end; pointer-events: none; }
/* in a dive the band frames the core and the toasts would lie across its top: the ticker lists the events */
.cube-mid.diving .cube-toasts { display: none; }
.cube-toast { max-width: 100%; padding: 6px 10px; font-size: .72rem; line-height: 1.35; letter-spacing: .02em; color: #d9ffe9; overflow-wrap: anywhere;
  background: rgba(2, 14, 9, .9); border: 1px solid rgba(57, 255, 136, .35); border-left: 3px solid var(--tell); border-radius: 6px;
  box-shadow: 0 0 18px rgba(57, 255, 136, .16); animation: toast 4s ease-out forwards; }
.toast-lesson { border-left-color: var(--lesson); color: #f2fff7; } .toast-sync { border-left-color: var(--sync); }
.toast-handoff { border-left-color: var(--handoff); } .toast-join { border-left-color: var(--borg); }
@keyframes toast { 0% { opacity: 0; transform: translateY(-6px); } 8% { opacity: 1; transform: none; } 85% { opacity: 1; } 100% { opacity: 0; } }
.cube-panel { position: absolute; z-index: 1; right: 0; bottom: 0; width: min(300px, 100%); max-height: 100%; overflow: auto; padding: 12px 14px;
  font-size: .74rem; background: rgba(2, 14, 9, .92); border: 1px solid rgba(57, 255, 136, .38); border-radius: 8px; backdrop-filter: blur(4px);
  box-shadow: 0 0 24px rgba(57, 255, 136, .12); animation: tk-in .25s ease-out; }
.cube-panel h3 { margin: 0 22px 8px 0; font-size: .86rem; color: var(--borg); letter-spacing: .06em; }
.cube-panel dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 10px; }
.cube-panel dt { color: var(--borg-dim); font-size: .62rem; text-transform: uppercase; letter-spacing: .08em; padding-top: 1px; }
.cube-panel dd { margin: 0; color: #c8ffdf; overflow-wrap: anywhere; }
.cube-drones { list-style: none; margin: 10px 0 0; padding: 8px 0 0; border-top: 1px solid var(--edge); display: grid; gap: 3px; }
.cube-link { color: var(--borg); text-align: left; text-decoration: underline dotted rgba(57, 255, 136, .5); text-underline-offset: 3px; }
.cube-link:hover { color: #eafff2; }
.cube-panel > a.cube-link { display: inline-block; margin-top: 10px; }
.cube-close { position: absolute; top: 6px; right: 10px; font-size: 1.1rem; color: var(--borg-dim); }
.cube-close:hover { color: var(--borg); }
/* placed by its near edge, `left` or (flipped) `right` (views/cube.rs tip_left, TIP_W and TIP_GAP): the
   margin keeps it off the pointer, and it narrows to the room on its side, so it stays on the canvas */
.cube-tip { position: absolute; z-index: 4; pointer-events: none; padding: 6px 9px; font-size: .72rem; line-height: 1.35; color: #d9ffe9; max-width: 280px;
  background: rgba(2, 14, 9, .92); border: 1px solid rgba(57, 255, 136, .4); border-radius: 6px; box-shadow: 0 0 16px rgba(57, 255, 136, .15);
  margin: 14px 0 0 14px; }
.cube-tip.flip { margin: 14px 14px 0 0; }
/* the title at most two lines: a lesson's question is cut, the panel shows it whole */
.cube-tip b { color: var(--borg); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
/* the bottom: legend chips that filter, the timeline that scrubs */
.cube-deck { display: grid; gap: 6px; min-width: 0; }
.cube-legend { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; font-size: .62rem; letter-spacing: .06em; color: var(--borg-dim); }
.lg { padding: 2px 8px; border: 1px solid var(--edge); border-radius: 999px; background: var(--glass); color: #c8ffdf; }
.lg:hover { border-color: var(--borg-dim); }
.lg::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 5px; border-radius: 50%; background: var(--c, var(--tell));
  box-shadow: 0 0 6px var(--c, var(--tell)); vertical-align: 0; }
.lg.messages { --c: var(--tell); } .lg.received { --c: var(--seen); } .lg.lessons { --c: var(--lesson); }
.lg.syncs { --c: var(--sync); } .lg.handoffs { --c: var(--handoff); } .lg.steering { --c: var(--veto); }
.lg.off { opacity: .45; text-decoration: line-through; }
.lg.off::before { background: transparent; box-shadow: inset 0 0 0 1px var(--c); }
.lg-help { margin-left: auto; }
.lg-fs { padding: 2px 8px; border: 1px solid var(--edge); border-radius: 999px; background: var(--glass); color: #c8ffdf; font: inherit; letter-spacing: inherit; }
.lg-fs:hover { border-color: var(--borg-dim); }
.lg-fs[aria-pressed="true"] { color: #eafff2; border-color: var(--borg-dim); background: rgba(57, 255, 136, .2); box-shadow: 0 0 8px rgba(57, 255, 136, .25); }
/* in a dive, the key line: how the core draws its lessons (views/cube.rs key_view); the swatches are
   canvas.rs's palette */
.cube-key { margin: 0; display: flex; flex-wrap: wrap; gap: 2px 12px; padding: 4px 8px; font-size: .62rem; line-height: 1.45; letter-spacing: .04em;
  color: #c8ffdf; border: 1px solid var(--edge); border-radius: 6px; background: var(--glass); backdrop-filter: blur(3px); }
.cube-key span { white-space: nowrap; }
/* the colours start a row of their own */
.ky-br { flex-basis: 100%; height: 0; } .ky-help { color: var(--borg-dim); } .ky-short { display: none; }
.ky { display: inline-block; width: 8px; height: 8px; margin-right: 5px; border-radius: 50%; vertical-align: -1px; background: var(--k); }
.ky-green { --k: #39ff88; } .ky-red { --k: #ff4d5e; } .ky-blue { --k: #4fd8ff; } .ky-dull { --k: #3f7f5e; }
/* paint.rs `shine`: a consolidated lesson's faint glow in its own tone */
.ky-halo { --k: #39ff88; box-shadow: 0 0 0 2px rgba(57, 255, 136, .22), 0 0 6px 2px rgba(57, 255, 136, .22); }
/* the bottom edge resizes the view (below the timeline, inside the padding) */
.cube-grip { position: absolute; left: 0; right: 0; bottom: 0; height: 9px; z-index: 4; cursor: ns-resize; touch-action: none; outline: none; }
.cube-grip::after { content: ""; position: absolute; left: 50%; bottom: 3px; width: 48px; height: 3px; margin-left: -24px; border-radius: 2px;
  background: var(--borg-dim); opacity: .45; }
.cube-grip:hover::after, .cube-grip:focus-visible::after { opacity: 1; box-shadow: 0 0 6px var(--borg); }
.cube:fullscreen { height: 100vh !important; border-radius: 0; }
.cube:fullscreen .cube-grip { display: none; }
.cube-tl { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "btns strip at"; gap: 8px; align-items: center; }
.tl-btns { grid-area: btns; display: flex; gap: 3px; }
.tl-btns button { font: .62rem var(--mono); letter-spacing: .04em; padding: 3px 7px; color: var(--borg); border: 1px solid rgba(57, 255, 136, .3);
  border-radius: 4px; background: var(--glass); white-space: nowrap; }
.tl-btns button:hover { background: rgba(57, 255, 136, .1); }
.tl-btns button[aria-pressed="true"] { color: #eafff2; background: rgba(57, 255, 136, .2); box-shadow: 0 0 8px rgba(57, 255, 136, .25); }
.tl-strip { grid-area: strip; position: relative; height: 34px; border: 1px solid var(--edge); border-radius: 4px; background: var(--glass);
  cursor: ew-resize; touch-action: none; overflow: hidden; }
.tl-strip > * { pointer-events: none; }
.tl-strip svg { position: absolute; left: 0; right: 0; top: 2px; width: 100%; height: calc(100% - 14px); }
.tl-strip path { opacity: .85; } .tl-strip path.messages { fill: var(--tell); } .tl-strip path.received { fill: var(--seen); }
.tl-strip path.lessons { fill: var(--lesson); } .tl-strip path.syncs { fill: var(--sync); } .tl-strip path.handoffs { fill: var(--handoff); }
.tl-strip path.steering { fill: var(--veto); }
.tl-day { position: absolute; top: 0; bottom: 0; padding-left: 3px; border-left: 1px solid rgba(57, 255, 136, .16); font-size: .6rem; line-height: 1;
  color: var(--borg-dim); display: flex; align-items: flex-end; padding-bottom: 2px; }
.tl-head { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #eafff2; box-shadow: 0 0 8px var(--borg); }
/* as wide as its longest label ("Wed, Nov 26 09:13 · catching up"): the strip keeps its width */
.tl-at { grid-area: at; width: 31ch; text-align: right; font-size: .62rem; color: var(--borg-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 640px) {
  .cube { height: clamp(560px, 86vh, 780px); }
  .cube-ui { padding: 10px; gap: 8px; }
  .cube-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
  .cube-stat { min-width: 0; padding: 4px 6px; } .cube-stat b { font-size: 1rem; }
  .cube-stat span { font-size: .52rem; letter-spacing: .04em; overflow-wrap: anywhere; }
  .cube-ticker { width: 100%; } .tk:nth-child(n+4) { display: none; }
  /* in a dive the ticker would lie across the core: a phone's band is all the core's */
  .cube-mid.diving .cube-ticker { display: none; }
  .cube-panel { width: 100%; }
  .lg-help { display: none; } .lg-dive { margin-left: auto; }
  /* a phone's key is the colours alone, a word or two each: its band is the core's (views/cube.rs key_view) */
  .ky-what, .ky-help, .ky-br, .ky-long { display: none; } .ky-short { display: inline; }
  /* the buttons take the full width of a phone: the clock gets its own row under the strip */
  .cube-tl { grid-template-columns: minmax(0, 1fr); grid-template-areas: "btns" "strip" "at"; gap: 6px; }
