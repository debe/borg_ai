<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Borg Collective</title>

<script type="module">
import init, * as bindings from '/borg-web-ui.js';
const wasm = await init({ module_or_path: '/borg-web-ui_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
<style>
:root {
  --paper: #f1f2f4; --panel: #ffffff; --panel-2: #f7f8fa; --ink: #12161c; --muted: #5a6371; --rule: #d5d9e0;
  --accent: #1f49c7; --accent-soft: #e2e8fa; --heat: #b8471f; --heat-soft: #f6e4dc; --good: #1f7a4d; --good-soft: #def0e6;
  --c-accent: #1f49c7; --c-good: #1f8a55; --c-heat: #c4501f; --c-violet: #6b45c9; --c-amber: #b7791f;
  --c-teal: #0f8a8a; --c-sky: #3b82c4; --c-pink: #c23f7a; --c-slate: #8a94a6; --c-muted: #5a6371;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --shadow: 0 1px 2px rgba(18, 22, 28, .05), 0 4px 16px rgba(18, 22, 28, .04);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d1015; --panel: #141922; --panel-2: #1a2030; --ink: #e3e7ee; --muted: #8d97a7; --rule: #272f3b;
    --accent: #8aa6ff; --accent-soft: #18213a; --heat: #f08a5d; --heat-soft: #2c1a12; --good: #5fc994; --good-soft: #12271c;
    --c-accent: #7f9cff; --c-good: #4fc48a; --c-heat: #f08a5d; --c-violet: #a98cf5; --c-amber: #e0a94a;
    --c-teal: #3cc6c6; --c-sky: #6cb2f0; --c-pink: #ee79ad; --c-slate: #6f7a8c; --c-muted: #8d97a7;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--sans); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
a { color: var(--accent); text-decoration: none; }
main { max-width: 1180px; margin: 0 auto; padding: 18px 16px 72px; display: grid; gap: 20px; }
h2 { margin: 0 0 12px; font-size: 1.02rem; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
h2 small { font-weight: 400; font-size: .8rem; color: var(--muted); }
.mono { font-family: var(--mono); font-size: .82em; }
.empty { color: var(--muted); font-size: .9rem; margin: 6px 0; }

/* header and tabs */
header.top { max-width: 1180px; margin: 0 auto; padding: 16px 16px 10px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand h1 { margin: 0; font-size: 1.3rem; letter-spacing: -.01em; }
.logo { width: 28px; height: 28px; }
.logo-cube { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.4; stroke-linejoin: round; }
.logo-edge { fill: none; stroke: var(--accent); stroke-width: 1.1; opacity: .6; }
.logo-core { fill: var(--accent); }
.grow { flex: 1; }
select, input.search { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 10px; max-width: 100%; }
input.search { width: min(420px, 100%); }
.drones-now { font: 500 .75rem var(--mono); color: var(--muted); }
.mode-badge { font: 500 .72rem var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); padding: 2px 8px; border: 1px solid var(--rule); border-radius: 10px; }
.mode-badge.live, .badge.mode-live { color: var(--c-teal); border-color: var(--c-teal); }
.live { font: 500 .72rem var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--c-slate); display: inline-block; }
.live.on i { background: var(--c-good); box-shadow: 0 0 0 0 var(--c-good); animation: pulse 2.4s ease-out infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c-good) 60%, transparent); } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
nav.tabs { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--rule); display: flex; gap: 2px; overflow-x: auto; padding: 0 max(16px, calc((100% - 1180px) / 2 + 16px)); scrollbar-width: none; }
nav.tabs a { color: var(--muted); padding: 10px 12px; font-weight: 500; font-size: .92rem; white-space: nowrap; border-bottom: 2px solid transparent; }
nav.tabs a:hover { color: var(--ink); }
nav.tabs a.on { color: var(--ink); border-bottom-color: var(--accent); }

/* panels and layout */
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.stack { display: grid; gap: 20px; min-width: 0; }
@media (max-width: 820px) { .two { grid-template-columns: 1fr; } }

/* tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.tile { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px 10px; display: grid; gap: 2px; box-shadow: var(--shadow); min-width: 0; }
.tile-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.tile .l { font: 500 .68rem var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.tile .v { font: 700 1.7rem/1.15 var(--sans); font-variant-numeric: tabular-nums; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .s { font-size: .78rem; color: var(--muted); }
.delta { font: 600 .7rem var(--mono); padding: 1px 6px; border-radius: 10px; background: var(--panel-2); color: var(--muted); }
.delta.good { color: var(--good); background: var(--good-soft); }
.delta.bad { color: var(--heat); background: var(--heat-soft); }
.tile-spark { height: 30px; margin-top: 4px; }
.spark { width: 100%; height: 30px; display: block; }
.spark-line { fill: none; stroke-width: 1.6; vector-effect: non-scaling-stroke; }

/* stacked chart */
.chart { position: relative; }
.chart-bar { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 6px; }
.legend-item { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; padding: 3px 8px; border-radius: 12px; border: 1px solid var(--rule); background: var(--panel); transition: opacity .15s; }
.legend-item i, .tip-row i, .dl-row i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; flex: none; }
.legend-item.off { opacity: .38; text-decoration: line-through; }
.seg { display: inline-flex; align-items: center; gap: 2px; background: var(--panel-2); border: 1px solid var(--rule); border-radius: 8px; padding: 2px; }
.seg button { font: 500 .74rem var(--mono); padding: 3px 9px; border-radius: 6px; color: var(--muted); }
.seg button.on { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
.seg-l { font: .72rem var(--mono); color: var(--muted); padding: 0 6px; }
.chart-plot { position: relative; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
svg .grid { stroke: var(--rule); stroke-width: 1; }
svg .axis { font: 11px var(--mono); fill: var(--muted); }
svg .axis.strong { fill: var(--ink); font-weight: 600; }
svg .cumline { fill: none; stroke: var(--ink); stroke-width: 2; stroke-dasharray: 5 4; opacity: .7; }
svg .hit { fill: transparent; }
svg .focus { fill: var(--accent-soft); opacity: .8; }
.tip { position: absolute; top: -4px; pointer-events: none; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.14); padding: 8px 10px; font-size: .78rem; min-width: 170px; z-index: 3; }
.tip-head { display: flex; justify-content: space-between; gap: 12px; font-weight: 600; margin-bottom: 4px; }
.tip-row { display: grid; grid-template-columns: 9px 1fr auto; align-items: center; gap: 6px; }
.tip-row b { font-family: var(--mono); font-weight: 500; }
.empty.overlay { position: absolute; inset: 40% 0 auto; text-align: center; }

/* funnel */
.funnel-step { display: grid; gap: 3px; margin-bottom: 12px; }
.funnel-label { font-size: .9rem; }
.funnel-label b { font-variant-numeric: tabular-nums; font-size: 1.05rem; }
.funnel-track { height: 14px; background: var(--panel-2); border-radius: 7px; overflow: hidden; }
.funnel-fill { height: 100%; border-radius: 7px; transition: width .4s ease; }
.funnel-note { font: .74rem var(--mono); color: var(--muted); }

/* donut */
.donut { display: grid; grid-template-columns: minmax(140px, 200px) 1fr; gap: 16px; align-items: center; }
@media (max-width: 520px) { .donut { grid-template-columns: 1fr; } .donut-fig { max-width: 200px; margin: 0 auto; } }
.donut svg { width: 100%; height: auto; }
.donut-seg { fill: none; stroke-width: 14; transition: opacity .15s; cursor: default; }
.donut-seg.dim { opacity: .3; }
.donut-empty { fill: none; stroke: var(--rule); stroke-width: 14; }
.donut-v { font: 700 15px var(--sans); fill: var(--ink); }
.donut-fig { margin: 0; text-align: center; }
.donut-c { font: .75rem var(--mono); color: var(--muted); margin-top: 6px; overflow-wrap: anywhere; }
.dl-row { display: grid; grid-template-columns: 9px 1fr auto 44px; gap: 8px; align-items: center; font-size: .86rem; padding: 4px 6px; border-radius: 6px; }
.dl-row.hl { background: var(--panel-2); }
.dl-row b { font-family: var(--mono); font-weight: 500; }
.dl-row em { font: .75rem var(--mono); color: var(--muted); font-style: normal; text-align: right; }

/* horizontal bars and ranks */
.hbar { display: grid; grid-template-columns: minmax(80px, 38%) 1fr 64px; gap: 8px; align-items: center; font-size: .84rem; padding: 3px 0; }
.hbar.pick { cursor: pointer; } .hbar.pick:hover .hbar-l { color: var(--accent); }
.hbar-l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar-t { height: 10px; background: var(--panel-2); border-radius: 5px; overflow: hidden; }
.hbar-f { display: block; height: 100%; border-radius: 5px; }
.hbar-v { font: .78rem var(--mono); text-align: right; }
.rank { display: grid; grid-template-columns: 1fr 90px 80px; gap: 10px; align-items: center; width: 100%; padding: 7px 4px; border-bottom: 1px solid var(--rule); font-size: .86rem; }
.rank:hover .rank-q { color: var(--accent); }
.rank-bar { height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
.rank-bar span { display: block; height: 100%; border-radius: 4px; }
.rank-v { font: .76rem var(--mono); text-align: right; color: var(--muted); }
@media (max-width: 520px) { .rank { grid-template-columns: 1fr 70px; } .rank-bar { display: none; } }

/* feed */
.feed { display: grid; gap: 2px; max-height: 640px; overflow-y: auto; }
.feed.compact { max-height: 430px; }
.feed-row { display: grid; grid-template-columns: 26px 1fr; gap: 10px; padding: 8px 6px; border-radius: 8px; }
.feed-row.new { animation: glow 2.6s ease-out; }
@keyframes glow { 0% { background: var(--accent-soft); } 100% { background: transparent; } }
.glyph { width: 24px; height: 24px; border-radius: 50%; color: #fff; display: grid; place-items: center; font-size: .78rem; font-weight: 700; }
.feed-body { min-width: 0; display: grid; gap: 2px; }
.feed-head { font-size: .88rem; font-weight: 550; }
.feed-detail { font-size: .82rem; color: var(--muted); overflow-wrap: anywhere; }
.feed-lesson { font-size: .82rem; color: var(--accent); }
.feed-lesson:hover { text-decoration: underline; }
.feed-meta { font: .72rem var(--mono); color: var(--muted); }
.more { display: inline-block; margin-top: 8px; font-size: .85rem; }

/* facts */
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.fact { display: grid; gap: 4px; align-content: start; background: var(--panel); border: 1px solid var(--rule); border-left: 4px solid var(--c-accent); border-radius: 10px; padding: 14px; box-shadow: var(--shadow); cursor: default; }
.fact.pick { cursor: pointer; } .fact.pick:hover { border-color: var(--accent); }
.fact.g { border-left-color: var(--c-good); } .fact.h { border-left-color: var(--c-heat); } .fact.m { border-left-color: var(--c-slate); } .fact.v { border-left-color: var(--c-violet); }
.fact-big { font: 700 1.35rem/1.2 var(--sans); overflow-wrap: anywhere; }
.fact-text { font-size: .86rem; color: var(--muted); }

/* knowledge */
.kn-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.kn-bar h2 { margin: 0; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: .9rem; color: var(--muted); }
.crumbs button { color: var(--accent); padding: 2px 4px; border-radius: 4px; }
.crumbs button.on { color: var(--ink); font-weight: 600; }
.treemap { width: 100%; height: auto; display: block; }
.tm-cell { cursor: pointer; }
.tm-cell rect { stroke: var(--panel); stroke-width: 1; transition: fill-opacity .2s; }
.tm-cell:hover rect { fill-opacity: 1 !important; }
.tm-text { fill: var(--ink); pointer-events: none; }
.tm-text.light { fill: #fff; }
.tm-label { font: 600 14px var(--sans); }
.tm-sub { font: 11px var(--mono); opacity: .85; }
.tm-sys { font: 700 12.5px var(--sans); fill: var(--ink); pointer-events: none; }
.tm-system { cursor: zoom-in; }
.tm-frame { fill: var(--panel-2); stroke-width: 1.5; }
.sys-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.sys-chip { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; padding: 3px 10px; border: 1px solid var(--rule); border-radius: 14px; background: var(--panel); }
.sys-chip:hover { border-color: var(--accent); }
.sys-chip i { width: 9px; height: 9px; border-radius: 2px; }
.sys-chip b { font: 600 .72rem var(--mono); color: var(--muted); }
.hint { font-size: .8rem; color: var(--muted); margin: 8px 0 0; }
.kn-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
@media (max-width: 900px) { .kn-grid { grid-template-columns: 1fr; } }
.kn-list { display: grid; gap: 12px; min-width: 0; }
.kn-side { display: grid; gap: 20px; min-width: 0; }
.group { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow); }
.group > summary { list-style: none; cursor: pointer; padding: 12px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.group > summary::-webkit-details-marker { display: none; }
.group > summary::before { content: "▸"; color: var(--muted); transition: transform .15s; }
.group[open] > summary::before { transform: rotate(90deg); }
.group-name { font-weight: 650; }
.group-count { font: 600 .72rem var(--mono); background: var(--accent-soft); color: var(--accent); padding: 1px 8px; border-radius: 10px; }
.group-meta { font: .74rem var(--mono); color: var(--muted); margin-left: auto; }
.cards { display: grid; gap: 8px; padding: 0 12px 12px; }
.panel .group { box-shadow: none; margin-top: 12px; }
.more-cards > summary { cursor: pointer; color: var(--accent); font-size: .86rem; padding: 6px 2px; list-style: none; }
.more-cards > summary::-webkit-details-marker { display: none; }
.more-cards[open] > summary { display: none; }
.cards.inner { padding: 0; }
.lesson { display: grid; gap: 5px; width: 100%; background: var(--panel-2); border: 1px solid transparent; border-radius: 8px; padding: 10px 12px; }
.lesson:hover { border-color: var(--accent); }
.lesson.dormant { opacity: .55; }
.lesson .q { font-weight: 600; font-size: .92rem; }
.lesson .c { color: var(--muted); font-size: .84rem; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font: .72rem var(--mono); color: var(--muted); }
.stat { margin-left: 2px; }
.chip { border: 1px solid currentColor; border-radius: 3px; padding: 0 6px; font: .68rem var(--mono); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.chip.a { color: var(--accent); } .chip.g { color: var(--good); } .chip.v { color: var(--c-violet); } .chip.h { color: var(--heat); }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(10, 14, 20, .38); z-index: 20; animation: fade .15s; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100vw); background: var(--panel); z-index: 21; overflow-y: auto; padding: 18px 20px 40px; box-shadow: -12px 0 40px rgba(0,0,0,.18); animation: slide .2s ease-out; display: grid; gap: 14px; align-content: start; }
@keyframes slide { from { transform: translateX(40px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
.drawer-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.x { font-size: 1.6rem; line-height: 1; color: var(--muted); padding: 0 4px; }
.drawer-q { margin: 0; font-size: 1.15rem; line-height: 1.35; }
.drawer-sec .k { font: 500 .68rem var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 6px; }
.drawer-sec ul { margin: 0; padding-left: 18px; font-size: .9rem; display: grid; gap: 3px; }
.conseq { margin: 0; padding: 10px 12px; background: var(--heat-soft); border-radius: 8px; font-size: .9rem; }
.meter { height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; margin-bottom: 6px; }
.meter span { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.facts-dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; font-size: .86rem; }
.facts-dl dt { color: var(--muted); }
.facts-dl dd { margin: 0; overflow-wrap: anywhere; }

/* steering, queen, drones */
.explain p { margin: 0 0 10px; color: var(--muted); max-width: 70ch; }
.explain pre { margin: 0; background: var(--panel-2); border-radius: 8px; padding: 12px; font: .8rem/1.6 var(--mono); overflow-x: auto; }
.reject { padding: 8px 0; border-bottom: 1px solid var(--rule); display: grid; gap: 3px; }
.reject-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.reject-why { font-size: .9rem; font-weight: 550; overflow-wrap: anywhere; }
.reject-in { font: .76rem var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.queen-list { display: grid; gap: 10px; }
.queen-card { display: grid; gap: 8px; padding: 12px; border-radius: 8px; background: var(--panel-2); margin-bottom: 10px; border-left: 3px solid var(--c-violet); }
.queen-card.answered { border-left-color: var(--c-good); }
.queen-card.dismissed { border-left-color: var(--c-slate); opacity: .75; }
.queen-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.queen-q { font-weight: 600; font-size: .92rem; }
.options { display: flex; flex-wrap: wrap; gap: 6px; }
.opt { font-size: .8rem; padding: 3px 9px; border-radius: 12px; border: 1px solid var(--rule); background: var(--panel); }
.opt.default { border-color: var(--c-violet); }
.opt.chosen { border-color: var(--c-good); background: var(--good-soft); font-weight: 600; }
.answer { font-size: .88rem; }
.badge { font: 600 .66rem var(--mono); text-transform: uppercase; letter-spacing: .06em; padding: 2px 7px; border-radius: 10px; background: var(--panel); border: 1px solid var(--rule); color: var(--muted); }
.badge.open, .badge.waiting { color: var(--c-violet); border-color: var(--c-violet); }
.badge.answered, .badge.working { color: var(--c-good); border-color: var(--c-good); }
.badge.idle { color: var(--c-amber); border-color: var(--c-amber); }
.badge.paused { color: var(--c-pink); border-color: var(--c-pink); }
.badge.remote { color: var(--c-sky); border-color: var(--c-sky); }
.toggle { font-size: .85rem; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
.drones { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.drone { display: grid; grid-template-columns: minmax(0, 1fr); min-width: 0; gap: 6px; align-content: start; padding: 12px; border-radius: 10px; background: var(--panel-2); border-top: 3px solid var(--c-slate); }
.drone.working { border-top-color: var(--c-good); } .drone.waiting { border-top-color: var(--c-violet); } .drone.idle { border-top-color: var(--c-amber); } .drone.ended { opacity: .6; }
.drone-head { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.drone-name { font-weight: 650; margin-right: auto; }
.drone-who { font-size: .82rem; color: var(--muted); }
.drone-doing { font-size: .86rem; }
.drone-files { display: flex; flex-wrap: wrap; gap: 6px; color: var(--muted); }
