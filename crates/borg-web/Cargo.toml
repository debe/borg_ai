[package]
name = "borg-web"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
# dist/ is the built page, checked in (scripts/ui.sh --check); ui/, its sources, is a separate workspace.
include = ["/src/**", "/dist/**", "/tests/**", "/README.md", "/LICENSE-*"]
description = "A local, live page of a collective's knowledge and usage statistics"

# A separate binary, like borg-mesh: the web stack stays out of the hook. `borg web ...` forwards here.
# The page is a Leptos client (ui/, its own workspace) built to dist/ with trunk and embedded below,
# so installing this crate needs no wasm toolchain.
[[bin]]
name = "borg-web"
path = "src/main.rs"

[dependencies]
borg = { package = "borg-ai", path = "../borg", version = "=0.7.12", default-features = false }
serde.workspace = true
serde_json.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
futures-util = { version = "0.3", default-features = false }

# mallopt(M_ARENA_MAX) at start (main.rs ARENAS).
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2"

[dev-dependencies]
# tests/drones_api.rs drives the router in process (ServiceExt::oneshot).
tower = { version = "0.5", default-features = false, features = ["util"] }
# The generated bench store (borg's benches/shape/mod.rs) hashes its lines.
blake3 = "1.8"

# Eight requests at once to every view of a real team's store: peak and retained memory (benches/load.rs).
[[bench]]
name = "load"
harness = false

[lints]
workspace = true
