[package]
name = "borg-web"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
# dist/ is the built page, checked in (scripts/ui.sh --check); ui/, its sources, is a separate workspace.
include = ["/src/**", "/dist/**", "/tests/**", "/LICENSE-*"]
description = "A local, live page of a collective's knowledge and usage statistics"

# A separate binary, like borg-mesh: the web stack stays out of the hook. `borg web ...` forwards here.
# The page is a Leptos client (ui/, its own workspace) built to dist/ with trunk and embedded below,
# so installing this crate needs no wasm toolchain.
[[bin]]
name = "borg-web"
path = "src/main.rs"

[dependencies]
borg = { package = "borg-ai", path = "../borg", version = "0.2.0", default-features = false }
serde.workspace = true
serde_json.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
futures-util = { version = "0.3", default-features = false }

[dev-dependencies]
# tests/drones_api.rs drives the router in process (ServiceExt::oneshot).
tower = { version = "0.5", default-features = false, features = ["util"] }
