[package]
name = "borg-mesh"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
include = ["/src/**", "/tests/**", "/LICENSE-*"]
description = "The team mind without a server: peer-to-peer sync of a collective's lessons between signed members"

# A separate binary on purpose: `borg hook` runs on every tool call and must stay small and fast,
# so the networking stack (iroh, tokio) lives only here; `borg mesh ...` forwards to it.
[[bin]]
name = "borg-mesh"
path = "src/main.rs"

[dependencies]
borg = { package = "borg-ai", path = "../borg", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
iroh = { version = "1.3", features = ["platform-verifier"] }
ed25519-dalek = "3"
blake3 = "1.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
qrcode = { version = "0.14.1", default-features = false }
data-encoding = "2"

[dev-dependencies]
iroh = { version = "1.3", features = ["platform-verifier", "test-utils"] }
