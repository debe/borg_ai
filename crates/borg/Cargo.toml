[package]
name = "borg-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "Collective mind for coding-agent drones: CLI and harness hooks"
# The canonical skill and TS adapters live in assets/ (symlinked from the repo's skills/ and adapters/)
# so include_str! stays inside the package. Integration tests read the repo around the crate: not shipped.
include = ["/src/**", "/assets/**", "/data/**", "/tests/fixtures/**", "/LICENSE-*"]

# Published as borg-ai (the crates.io name); the library and the binary stay `borg`.
[lib]
name = "borg"
path = "src/lib.rs"

[[bin]]
name = "borg"
path = "src/main.rs"

[dependencies]
borg-trace = { path = "../borg-trace", version = "=0.3.0" }
serde.workspace = true
# preserve_order: merging into settings.json keeps the engineer's key order (install.rs)
serde_json = { workspace = true, features = ["preserve_order"] }
regex.workspace = true
# the expert drone: its own process group, killed with borg (expert_route.rs)
libc = "0.2"
# hashed session and repo ids in the outcomes the team sees (outcome.rs `tag`); the mesh uses it already
blake3 = "1.8"
# Vector recall at the Stop step (vectors.rs, internal evaluation "vectors", not published): embedded SeekStorm, and a Model2Vec
# embedder that maps the model file instead of reading it. SeekStorm is pinned `=`: each store keeps its index on
# disk (`<store>/vectors/`) in SeekStorm's own format, so an upgrade is a deliberate step, checked with `borg vectors --rebuild`.
seekstorm = { version = "=3.3.13", default-features = false, optional = true }
tokio = { version = "1", features = ["rt"], optional = true }
tokenizers = { version = "0.21", default-features = false, features = ["onig"], optional = true }
safetensors = { version = "0.5", optional = true }
memmap2 = { version = "0.9", optional = true }
half = { version = "2", optional = true }
sha2 = { version = "0.11", optional = true }

# docs.rs builds the lean library, without the vectors stack (SeekStorm, tokenizers).
[package.metadata.docs.rs]
no-default-features = true

[features]
# Vectors are on by default; `--no-default-features` builds a lean binary (BM25 only).
default = ["vectors"]
vectors = ["dep:seekstorm", "dep:tokio", "dep:tokenizers", "dep:safetensors", "dep:memmap2", "dep:half", "dep:sha2"]
